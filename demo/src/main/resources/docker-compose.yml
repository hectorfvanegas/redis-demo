services:
  postgres-db:
    image: postgres:15-alpine
    container_name: postgres-demo
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin_password
      POSTGRES_DB: demo_db
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  redis-cache:
    image: redis:alpine
    container_name: redis-demo
    ports:
      - "6379:6379"

volumes:
  pg_data:
